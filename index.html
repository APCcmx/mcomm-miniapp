<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prueba de Conexión - n8n</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f5;
            color: #18181b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
        #resultado {
            margin-top: 16px;
            font-size: 0.9rem;
            word-break: break-all;
            color: #52525b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Prueba de Diagnóstico n8n</h2>
        <p>Haz clic para verificar la comunicación con el servidor de producción.</p>
        <button onclick="probarConexion()">Probar Conexión</button>
        <div id="resultado">Esperando acción...</div>
    </div>

    <script>
        async function probarConexion() {
            const divResultado = document.getElementById('resultado');
            divResultado.innerText = "Conectando con n8n...";
            divResultado.style.color = "#2563eb";

            const urlWebhook = 'https://automatizacion-abordaje-n8n.iqzp3s.easypanel.host/webhook/bitacora-abordaje';

            try {
                const response = await fetch(urlWebhook, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origen: "Prueba desde Telegram Mini App",
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                divResultado.innerText = "¡Conexión Exitosa! Respuesta: " + JSON.stringify(data);
                divResultado.style.color = "#16a34a"; // Verde éxito

            } catch (error) {
                console.error("Detalle del error:", error);
                divResultado.innerText = "Fallo: " + error.message;
                divResultado.style.color = "#dc2626"; // Rojo error
            }
        }
    </script>
</body>
</html>
