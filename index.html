<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora de Abordaje - MCOMM</title>
    <!-- SDK oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f5);
            --text-color: var(--tg-theme-text-color, #18181b);
            --hint-color: var(--tg-theme-hint-color, #71717a);
            --button-color: var(--tg-theme-button-color, #2563eb);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fafafa;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--button-color);
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:active {
            opacity: 0.85;
        }

        .btn-submit:disabled {
            background-color: #a1a1aa;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 12px;
            font-size: 0.875rem;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Abordaje</h2>
        <form id="bitacoraForm">
            
            <div class="form-group">
                <label for="ruta">Ruta / Unidad</label>
                <input type="text" id="ruta" name="ruta" placeholder="Ej. C-15 A" required>
            </div>

            <div class="form-group">
                <label for="operador">Nombre del Operador</label>
                <input type="text" id="operador" name="operador" placeholder="Nombre completo" required>
            </div>

            <div class="form-group">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones" placeholder="Detalles de la supervisión..."></textarea>
            </div>

            <div class="form-group">
                <label for="fotos">Evidencia Fotográfica</label>
                <input type="file" id="fotos" name="fotos" accept="image/*" capture="environment">
            </div>

            <button type="submit" class="btn-submit" id="btnEnviar">Enviar Registro</button>
            <div id="loading">Enviando datos al servidor... Por favor espere.</div>
        </form>
    </div>

    <script>
        // Inicializar Telegram WebApp SDK
        const tg = window.Telegram.WebApp;
        tg.expand();

        const form = document.getElementById('bitacoraForm');
        const btnEnviar = document.getElementById('btnEnviar');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Bloquear interfaz durante el envío
            btnEnviar.disabled = true;
            loading.style.display = 'block';

            // Capturar datos del formulario
            const formData = new FormData();
            formData.append('ruta', document.getElementById('ruta').value);
            formData.append('operador', document.getElementById('operador').value);
            formData.append('observaciones', document.getElementById('observaciones').value);
            
            // Adjuntar imagen si fue seleccionada
            const fotoInput = document.getElementById('fotos');
            if (fotoInput.files.length > 0) {
                formData.append('fotos', fotoInput.files[0]);
            }

            // Identificador opcional del usuario de Telegram
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                formData.append('telegram_user', tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.id);
            }

            try {
                // URL absoluta de producción en tu n8n de Easypanel
                const N8N_WEBHOOK_URL = 'https://automatizacion-abordaje-n8n.iqzp3s.easypanel.host/webhook/bitacora-abordaje';

                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Error en el servidor: ${response.status} ${response.statusText}`);
                }

                const resultado = await response.json();
                
                // Notificación de éxito y cierre de la Mini App en Telegram
                alert('¡Bitácora registrada con éxito!');
                tg.close();

            } catch (error) {
                console.error('Fallo en la petición:', error);
                alert('No se pudo conectar con el servidor: ' + error.message);
                btnEnviar.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
