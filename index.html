<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora de Avance Diario - MCOMM</title>
    <!-- SDK oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f5);
            --text-color: var(--tg-theme-text-color, #18181b);
            --hint-color: var(--tg-theme-hint-color, #71717a);
            --button-color: var(--tg-theme-button-color, #2563eb);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
            color: var(--button-color);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fafafa;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--button-color);
            background-color: #fff;
        }

        .checkbox-group {
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            padding: 10px;
            background-color: #fafafa;
            max-height: 150px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .checkbox-item input {
            width: auto;
            margin-right: 8px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:active {
            opacity: 0.85;
        }

        .btn-submit:disabled {
            background-color: #a1a1aa;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 12px;
            font-size: 0.875rem;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bitácora de Avance Diario</h2>
        <form id="bitacoraForm">
            
            <div class="form-group">
                <label for="idp">IDP (ID Project):</label>
                <input type="text" id="idp" name="idp" placeholder="Ingrese IDP" required>
            </div>

            <div class="form-group">
                <label for="circuito">Nombre del Circuito:</label>
                <input type="text" id="circuito" name="circuito" placeholder="Nombre del circuito" required>
            </div>

            <div class="form-group">
                <label for="operador">Operador:</label>
                <select id="operador" name="operador" required>
                    <option value="AMX">AMX</option>
                    <option value="Operador 2">Operador 2</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tecnología (Selección Múltiple):</label>
                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" name="tecnologia" value="DRX-30"> DRX-30</div>
                    <div class="checkbox-item"><input type="checkbox" name="tecnologia" value="DRX-90"> DRX-90</div>
                    <div class="checkbox-item"><input type="checkbox" name="tecnologia" value="EMXH800"> EMXH800</div>
                    <div class="checkbox-item"><input type="checkbox" name="tecnologia" value="HiT"> HiT</div>
                    <div class="checkbox-item"><input type="checkbox" name="tecnologia" value="GROOVE"> GROOVE</div>
                    <div class="checkbox-item"><input type="checkbox" name="tecnologia" value="XTM102"> XTM102</div>
                </div>
            </div>

            <div class="form-group">
                <label for="reporta">Nombre de quien reporta:</label>
                <select id="reporta" name="reporta" required>
                    <option value="Carlos Pérez">Carlos Pérez</option>
                    <option value="Supervisor 2">Supervisor 2</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fotos">Evidencia Fotográfica:</label>
                <input type="file" id="fotos" name="fotos" accept="image/*" capture="environment">
            </div>

            <button type="submit" class="btn-submit" id="btnEnviar">Enviar Registro</button>
            <div id="loading">Enviando datos al servidor... Por favor espere.</div>
        </form>
    </div>

    <script>
        // Inicializar SDK de Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        const form = document.getElementById('bitacoraForm');
        const btnEnviar = document.getElementById('btnEnviar');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            btnEnviar.disabled = true;
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('idp', document.getElementById('idp').value);
            formData.append('circuito', document.getElementById('circuito').value);
            formData.append('operador', document.getElementById('operador').value);
            formData.append('reporta', document.getElementById('reporta').value);

            // Recolectar tecnologías seleccionadas
            const tecnologias = [];
            document.querySelectorAll('input[name="tecnologia"]:checked').forEach((checkbox) => {
                tecnologias.push(checkbox.value);
            });
            formData.append('tecnologias', tecnologias.join(', '));

            // Adjuntar archivo si existe
            const fotoInput = document.getElementById('fotos');
            if (fotoInput.files.length > 0) {
                formData.append('fotos', fotoInput.files[0]);
            }

            try {
                // URL absoluta de producción en tu n8n de Easypanel
                const N8N_WEBHOOK_URL = 'https://automatizacion-abordaje-n8n.iqzp3s.easypanel.host/webhook/bitacora-abordaje';

                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'cors',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                }

                alert('¡Bitácora registrada con éxito!');
                tg.close();

            } catch (error) {
                console.error('Fallo en la petición:', error);
                alert('Error de conexión: ' + error.message);
                btnEnviar.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
